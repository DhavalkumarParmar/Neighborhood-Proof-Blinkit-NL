<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1A1A1A"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6B6B6B"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#FFFFFF"/>

  <text x="30" y="42" font-size="25" font-weight="700" fill="#1A1A1A">Neighborhood Proof — system architecture</text>
  <text x="30" y="68" font-size="16" fill="#4A4A4A">Every number is counted in code. The model writes one sentence and never a figure.</text>

  <!-- legend -->
  <rect x="742" y="26" width="20" height="20" rx="3" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="770" y="42" font-size="16" fill="#1A1A1A">Deterministic code</text>
  <rect x="742" y="54" width="20" height="20" rx="3" fill="#FBEBCF" stroke="#E69F00" stroke-width="3"/>
  <text x="770" y="70" font-size="16" fill="#1A1A1A">Model-generated</text>
  <rect x="962" y="26" width="20" height="20" rx="3" fill="#EDEDED" stroke="#5A5A5A" stroke-width="3"/>
  <text x="990" y="42" font-size="16" fill="#1A1A1A">Data / fallback</text>

  <!-- ============ LLM branch (upper row) ============ -->
  <rect x="432" y="112" width="196" height="96" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="530" y="146" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">/api/summary</text>
  <text x="530" y="170" font-size="15" text-anchor="middle" fill="#10243A">recomputes facts</text>
  <text x="530" y="190" font-size="15" text-anchor="middle" fill="#10243A">server-side</text>

  <rect x="676" y="112" width="196" height="96" rx="10" fill="#FBEBCF" stroke="#E69F00" stroke-width="3"/>
  <text x="774" y="142" font-size="17" font-weight="700" text-anchor="middle" fill="#3D2A05">Gemini 3.6 Flash</text>
  <text x="774" y="165" font-size="15" text-anchor="middle" fill="#3D2A05">gets review text only</text>
  <text x="774" y="187" font-size="15" font-weight="700" text-anchor="middle" fill="#3D2A05">writes 1–2 sentences</text>

  <rect x="920" y="112" width="196" height="96" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="1018" y="146" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">Figure guard</text>
  <text x="1018" y="170" font-size="15" text-anchor="middle" fill="#10243A">sanitise()</text>
  <text x="1018" y="190" font-size="15" font-weight="700" text-anchor="middle" fill="#10243A">drops any digit</text>

  <!-- ============ deterministic spine (middle row) ============ -->
  <rect x="30" y="322" width="180" height="96" rx="10" fill="#EDEDED" stroke="#5A5A5A" stroke-width="3"/>
  <text x="120" y="352" font-size="17" font-weight="700" text-anchor="middle" fill="#1A1A1A">Synthetic data</text>
  <text x="120" y="375" font-size="15" text-anchor="middle" fill="#1A1A1A">ledger · catalog</text>
  <text x="120" y="396" font-size="15" text-anchor="middle" fill="#1A1A1A">56,522 rows</text>

  <rect x="248" y="322" width="180" height="96" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="338" y="352" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">Retrieval layer</text>
  <text x="338" y="375" font-size="15" text-anchor="middle" fill="#10243A">proof-core.ts</text>
  <text x="338" y="396" font-size="15" font-weight="700" text-anchor="middle" fill="#10243A">counts rows</text>

  <rect x="466" y="322" width="180" height="96" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="556" y="352" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">Plain-language</text>
  <text x="556" y="375" font-size="15" text-anchor="middle" fill="#10243A">copy.ts</text>
  <text x="556" y="396" font-size="15" text-anchor="middle" fill="#10243A">“low for beauty”</text>

  <rect x="920" y="322" width="196" height="96" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="1018" y="352" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">Proof card</text>
  <text x="1018" y="375" font-size="15" text-anchor="middle" fill="#10243A">numbers render first,</text>
  <text x="1018" y="396" font-size="15" text-anchor="middle" fill="#10243A">sentence arrives after</text>

  <!-- ============ fallback (lower row) ============ -->
  <rect x="600" y="500" width="300" height="80" rx="10" fill="#EDEDED" stroke="#5A5A5A" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="750" y="530" font-size="17" font-weight="700" text-anchor="middle" fill="#1A1A1A">Silent fallback</text>
  <text x="750" y="555" font-size="15" text-anchor="middle" fill="#1A1A1A">numbers alone · no error message</text>

  <!-- ============ arrows ============ -->
  <!-- spine -->
  <line x1="210" y1="370" x2="242" y2="370" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="428" y1="370" x2="460" y2="370" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M646 370 H 914" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="700" y="356" font-size="15" text-anchor="middle" fill="#1A1A1A">counts + reads</text>

  <!-- retrieval up into api route -->
  <path d="M338 322 V 160 H 426" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="352" y="248" font-size="15" fill="#1A1A1A">review strings only</text>

  <!-- api -> gemini -> guard -->
  <line x1="628" y1="160" x2="670" y2="160" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="872" y1="160" x2="914" y2="160" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- guard down into proof card -->
  <path d="M1018 208 V 316" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1030" y="268" font-size="15" fill="#1A1A1A">sentence</text>

  <!-- gemini failure -> fallback -->
  <path d="M774 208 V 494" fill="none" stroke="#6B6B6B" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arg)"/>
  <text x="762" y="462" font-size="15" text-anchor="end" fill="#4A4A4A">timeout · HTTP error · no key</text>

  <!-- guard failure -> fallback -->
  <path d="M950 208 H 890 V 494" fill="none" stroke="#6B6B6B" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arg)"/>
  <text x="900" y="462" font-size="15" fill="#4A4A4A">all sentences dropped</text>

  <!-- fallback -> proof card -->
  <path d="M900 540 H 1092 V 424" fill="none" stroke="#6B6B6B" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arg)"/>

  <text x="30" y="600" font-size="15" fill="#4A4A4A">Solid = normal path. Dashed = degradation. The card never blocks on the model: numbers are server-rendered, the sentence is fetched after.</text>
</svg>
