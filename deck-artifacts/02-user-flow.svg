<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect width="1240" height="760" fill="#FFFFFF"/>

  <text x="30" y="42" font-size="25" font-weight="700" fill="#1A1A1A">User flow — and the four states the proof card resolves to</text>
  <text x="30" y="68" font-size="16" fill="#4A4A4A">Branch points are decided in code by getProof() in lib/proof-core.ts. Thresholds are the real constants.</text>

  <!-- screens across the top -->
  <rect x="30" y="100" width="200" height="86" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="130" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">1 · Profile picker</text>
  <text x="130" y="153" font-size="15" text-anchor="middle" fill="#10243A">3 shoppers, each</text>
  <text x="130" y="173" font-size="15" text-anchor="middle" fill="#10243A">bound to a dark store</text>

  <rect x="272" y="100" width="200" height="86" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="372" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">2 · Browse</text>
  <text x="372" y="153" font-size="15" text-anchor="middle" fill="#10243A">150 SKUs · proof line</text>
  <text x="372" y="173" font-size="15" text-anchor="middle" fill="#10243A">replaces star rating</text>

  <rect x="514" y="100" width="200" height="86" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="614" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">3 · Product page</text>
  <text x="614" y="153" font-size="15" text-anchor="middle" fill="#10243A">proof card sits</text>
  <text x="614" y="173" font-size="15" text-anchor="middle" fill="#10243A">directly under price</text>

  <rect x="1010" y="100" width="200" height="86" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="1110" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">4 · Cart</text>
  <text x="1110" y="153" font-size="15" text-anchor="middle" fill="#10243A">stub — checkout</text>
  <text x="1110" y="173" font-size="15" text-anchor="middle" fill="#10243A">not built</text>

  <line x1="230" y1="143" x2="266" y2="143" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="472" y1="143" x2="508" y2="143" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- gate 1 -->
  <path d="M614 232 L806 292 L614 352 L422 292 Z" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="3"/>
  <text x="614" y="284" font-size="16" font-weight="700" text-anchor="middle" fill="#1A1A1A">Households at this store,</text>
  <text x="614" y="306" font-size="16" font-weight="700" text-anchor="middle" fill="#1A1A1A">last 30 days  ≥ 30 ?</text>
  <line x1="614" y1="186" x2="614" y2="226" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- gate 2 (left, from "no") -->
  <path d="M240 432 L420 492 L240 552 L60 492 Z" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="3"/>
  <text x="240" y="484" font-size="16" font-weight="700" text-anchor="middle" fill="#1A1A1A">Households across</text>
  <text x="240" y="506" font-size="16" font-weight="700" text-anchor="middle" fill="#1A1A1A">the city  ≥ 30 ?</text>
  <path d="M422 292 H 240 V 426" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="252" y="392" font-size="15" font-weight="700" fill="#1A1A1A">no</text>

  <!-- gate 3 (right, from "yes") -->
  <path d="M950 432 L1130 492 L950 552 L770 492 Z" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="3"/>
  <text x="950" y="484" font-size="16" font-weight="700" text-anchor="middle" fill="#1A1A1A">Return rate vs</text>
  <text x="950" y="506" font-size="16" font-weight="700" text-anchor="middle" fill="#1A1A1A">category baseline</text>
  <path d="M806 292 H 950 V 426" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="962" y="392" font-size="15" font-weight="700" fill="#1A1A1A">yes</text>

  <!-- outcome: NO DATA -->
  <rect x="30" y="620" width="238" height="104" rx="10" fill="#EDEDED" stroke="#5A5A5A" stroke-width="3"/>
  <text x="149" y="650" font-size="17" font-weight="700" text-anchor="middle" fill="#1A1A1A">NO DATA</text>
  <text x="149" y="676" font-size="15" text-anchor="middle" fill="#1A1A1A">“New here.</text>
  <text x="149" y="697" font-size="15" text-anchor="middle" fill="#1A1A1A">No orders yet</text>
  <text x="149" y="716" font-size="15" text-anchor="middle" fill="#1A1A1A">to show you.”</text>
  <path d="M180 546 L 152 614" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="150" y="578" font-size="15" font-weight="700" text-anchor="end" fill="#1A1A1A">noData: true</text>

  <!-- outcome: WIDENED -->
  <rect x="300" y="620" width="250" height="104" rx="10" fill="#FBEBCF" stroke="#E69F00" stroke-width="3"/>
  <text x="425" y="650" font-size="17" font-weight="700" text-anchor="middle" fill="#3D2A05">WIDENED</text>
  <text x="425" y="676" font-size="15" text-anchor="middle" fill="#3D2A05">“Too few orders near you.</text>
  <text x="425" y="697" font-size="15" text-anchor="middle" fill="#3D2A05">Showing all of Vadodara</text>
  <text x="425" y="716" font-size="15" text-anchor="middle" fill="#3D2A05">instead.”</text>
  <path d="M300 546 L 400 614" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="300" y="578" font-size="15" font-weight="700" text-anchor="end" fill="#1A1A1A">widened: true</text>

  <!-- outcome: NORMAL -->
  <rect x="600" y="620" width="270" height="104" rx="10" fill="#D6E9F5" stroke="#0072B2" stroke-width="3"/>
  <text x="735" y="650" font-size="17" font-weight="700" text-anchor="middle" fill="#10243A">NORMAL</text>
  <text x="735" y="676" font-size="15" text-anchor="middle" fill="#10243A">“212 homes near you”</text>
  <text x="735" y="697" font-size="15" text-anchor="middle" fill="#10243A">“9 sent it back.</text>
  <text x="735" y="716" font-size="15" text-anchor="middle" fill="#10243A">That’s low for beauty.”</text>
  <path d="M880 540 L 760 614" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="742" y="580" font-size="15" font-weight="700" text-anchor="end" fill="#1A1A1A">ratio ≤ 1.4</text>

  <!-- outcome: NEGATIVE -->
  <rect x="920" y="620" width="290" height="104" rx="10" fill="#FBEBCF" stroke="#E69F00" stroke-width="3"/>
  <text x="1065" y="650" font-size="17" font-weight="700" text-anchor="middle" fill="#3D2A05">NEGATIVE</text>
  <text x="1065" y="676" font-size="15" text-anchor="middle" fill="#3D2A05">“11 of 38 sent it back.</text>
  <text x="1065" y="697" font-size="15" text-anchor="middle" fill="#3D2A05">That’s high.”</text>
  <text x="1065" y="717" font-size="15" text-anchor="middle" fill="#3D2A05">denominator shown</text>
  <path d="M1030 546 L 1065 614" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="1080" y="586" font-size="15" font-weight="700" fill="#1A1A1A">ratio &gt; 1.4</text>

  <!-- all states -> cart -->
  <text x="1110" y="222" font-size="15" text-anchor="middle" fill="#4A4A4A">reached from all four states</text>
</svg>
